<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="How it works: the phone shares over Wi-Fi, the TV scans or finds it, and plays">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101026"/><stop offset="1" stop-color="#05070C"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset="0.5" stop-color="#3B1F5C"/><stop offset="1" stop-color="#0B3B4A"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica Neue, Roboto, Arial, sans-serif">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <!-- phone -->
    <g transform="translate(150 60)">
      <rect width="130" height="230" rx="22" fill="#0B0B12" stroke="url(#brand)" stroke-width="3"/>
      <rect x="10" y="18" width="110" height="194" rx="12" fill="url(#screen)"/>
      <rect x="22" y="34" width="86" height="54" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="22" y="98" width="40" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.14"/>
      <rect x="68" y="98" width="40" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.14"/>
      <rect x="22" y="168" width="86" height="28" rx="14" fill="#22D3EE"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></rect>
      <text x="65" y="187" font-size="12" font-weight="700" fill="#05070C" text-anchor="middle">SHARING</text>
    </g>
    <text x="215" y="322" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">1 · Phone shares</text>
    <!-- wifi arcs -->
    <g transform="translate(330 175)" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round">
      <path d="M0 -20 A28 28 0 0 1 0 20"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M14 -36 A50 50 0 0 1 14 36"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></path>
      <path d="M28 -52 A72 72 0 0 1 28 52"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></path>
    </g>
    <!-- data path with packets -->
    <path id="lane" d="M420 175 C 560 90, 700 260, 840 175" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="6 10"/>
    <g>
      <rect x="-14" y="-9" width="28" height="18" rx="4" fill="url(#brand)"><animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#lane" xlink:href="#lane"/></animateMotion></rect>
      <rect x="-10" y="-7" width="20" height="14" rx="3" fill="#A78BFA"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" rotate="auto"><mpath href="#lane" xlink:href="#lane"/></animateMotion></rect>
      <rect x="-10" y="-7" width="20" height="14" rx="3" fill="#67E8F9"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" rotate="auto"><mpath href="#lane" xlink:href="#lane"/></animateMotion></rect>
    </g>
    <text x="630" y="322" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">2 · Same Wi-Fi, a QR scan, or a direct link</text>
    <!-- QR tile -->
    <g transform="translate(596 40)">
      <rect width="68" height="68" rx="10" fill="#FFFFFF"/>
      <g fill="#05070C">
        <rect x="8" y="8" width="18" height="18"/><rect x="42" y="8" width="18" height="18"/><rect x="8" y="42" width="18" height="18"/>
        <rect x="12" y="12" width="10" height="10" fill="#FFFFFF"/><rect x="46" y="12" width="10" height="10" fill="#FFFFFF"/><rect x="12" y="46" width="10" height="10" fill="#FFFFFF"/>
        <rect x="30" y="30" width="6" height="6"/><rect x="42" y="42" width="6" height="6"/><rect x="52" y="50" width="6" height="8"/><rect x="30" y="48" width="6" height="10"/>
      </g>
      <rect x="0" y="0" width="68" height="3" fill="#22D3EE"><animate attributeName="y" values="2;63;2" dur="2s" repeatCount="indefinite"/></rect>
    </g>
    <!-- TV -->
    <g transform="translate(860 50)">
      <rect width="300" height="186" rx="14" fill="#0B0B12" stroke="url(#brand)" stroke-width="3"/>
      <rect x="10" y="10" width="280" height="166" rx="8" fill="url(#screen)"/>
      <rect x="10" y="10" width="280" height="166" rx="8" fill="#000000" fill-opacity="0.25"/>
      <text x="34" y="78" font-size="26" font-weight="800" fill="#FFFFFF">Now playing</text>
      <text x="34" y="104" font-size="14" fill="#CBD5E1">4K · Dolby Vision · Atmos</text>
      <rect x="34" y="140" width="232" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="34" y="140" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="20;232;20" dur="8s" repeatCount="indefinite"/></rect>
      <circle cx="252" cy="62" r="20" fill="#FFFFFF"><animate attributeName="r" values="18;22;18" dur="1.6s" repeatCount="indefinite"/></circle>
      <path d="M246 52 L262 62 L246 72 Z" fill="#05070C"/>
      <rect x="120" y="192" width="60" height="10" rx="3" fill="#2A2A35"/>
      <rect x="90" y="202" width="120" height="6" rx="3" fill="#2A2A35"/>
    </g>
    <text x="1010" y="322" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">3 · Every screen plays</text>
  </g>
</svg>
