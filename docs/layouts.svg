<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Four layouts: Glass, Spotlight, Material and Bento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101026"/><stop offset="1" stop-color="#05070C"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset="0.5" stop-color="#3B1F5C"/><stop offset="1" stop-color="#0B3B4A"/></linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1917"/><stop offset="0.5" stop-color="#3F2A14"/><stop offset="1" stop-color="#2A1A3F"/></linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F378B"/><stop offset="1" stop-color="#1E3A5F"/></linearGradient>
    <linearGradient id="bento" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334A7A"/><stop offset="1" stop-color="#6B3A8C"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="330" rx="24"/></clipPath>
    <clipPath id="c"><rect width="270" height="170" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Helvetica Neue, Roboto, Arial, sans-serif">
    <rect width="1280" height="330" fill="url(#bg)"/>

    <g transform="translate(40 50)">
      <g clip-path="url(#c)">
        <rect width="270" height="170" fill="url(#glass)"/>
        <rect x="80" y="12" width="110" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="16" y="44" width="150" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.22"><animate attributeName="fill-opacity" values="0.15;0.32;0.15" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="16" y="126" width="56" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.16"/><rect x="80" y="126" width="56" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.16"/><rect x="144" y="126" width="56" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.16"/><rect x="208" y="126" width="56" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.16"/>
      </g>
      <rect width="270" height="170" rx="14" fill="none" stroke="#67E8F9" stroke-width="3" stroke-opacity="0"><animate attributeName="stroke-opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
      <text x="0" y="206" font-size="22" font-weight="800" fill="#F8FAFC">Glass</text>
      <text x="0" y="232" font-size="15" fill="#94A3B8">Floating glass, big hero</text>
    </g>

    <g transform="translate(345 50)">
      <g clip-path="url(#c)">
        <rect width="270" height="170" fill="url(#spot)"/>
        <rect width="52" height="170" fill="#000000" fill-opacity="0.35"/>
        <rect x="10" y="20" width="32" height="5" rx="2" fill="#F5B14C"/><rect x="10" y="36" width="28" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.5"/><rect x="10" y="52" width="30" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.5"/><rect x="10" y="68" width="24" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>
        <rect x="68" y="44" width="140" height="22" rx="3" fill="#FFFFFF"><animate attributeName="width" values="40;140;140;40" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="68" y="74" width="90" height="8" rx="3" fill="#F5B14C"/>
        <rect x="68" y="124" width="190" height="34" rx="4" fill="#FFFFFF" fill-opacity="0.16"/>
      </g>
      <rect width="270" height="170" rx="14" fill="none" stroke="#F5B14C" stroke-width="3" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
      <text x="0" y="206" font-size="22" font-weight="800" fill="#F8FAFC">Spotlight</text>
      <text x="0" y="232" font-size="15" fill="#94A3B8">Full-screen art, side menu</text>
    </g>

    <g transform="translate(650 50)">
      <g clip-path="url(#c)">
        <rect width="270" height="170" fill="#141218"/>
        <rect x="14" y="12" width="120" height="14" rx="7" fill="#D0BCFF" fill-opacity="0.45"/>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-190 0;-190 0;0 0" keyTimes="0;0.3;0.5;0.8;1" dur="6s" repeatCount="indefinite"/>
          <rect x="14" y="36" width="180" height="76" rx="16" fill="url(#mat)"/>
          <rect x="204" y="36" width="180" height="76" rx="16" fill="#7F67BE"/>
        </g>
        <text x="20" y="160" font-size="40" font-weight="800" fill="none" stroke="#D0BCFF" stroke-width="1.5">1</text>
        <rect x="46" y="124" width="30" height="40" rx="6" fill="#E6E0E9" fill-opacity="0.25"/>
        <text x="92" y="160" font-size="40" font-weight="800" fill="none" stroke="#D0BCFF" stroke-width="1.5">2</text>
        <rect x="120" y="124" width="30" height="40" rx="6" fill="#E6E0E9" fill-opacity="0.25"/>
        <text x="166" y="160" font-size="40" font-weight="800" fill="none" stroke="#D0BCFF" stroke-width="1.5">3</text>
        <rect x="196" y="124" width="30" height="40" rx="6" fill="#E6E0E9" fill-opacity="0.25"/>
      </g>
      <rect width="270" height="170" rx="14" fill="none" stroke="#D0BCFF" stroke-width="3" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
      <text x="0" y="206" font-size="22" font-weight="800" fill="#F8FAFC">Material</text>
      <text x="0" y="232" font-size="15" fill="#94A3B8">Carousel and Top picks</text>
    </g>

    <g transform="translate(955 50)">
      <g clip-path="url(#c)">
        <rect width="270" height="170" fill="#0B0B0E"/>
        <rect x="10" y="10" width="124" height="150" rx="12" fill="url(#bento)"/>
        <rect x="142" y="10" width="118" height="70" rx="12" fill="#18181D"><animate attributeName="fill" values="#18181D;#26263A;#18181D" dur="2.5s" repeatCount="indefinite"/></rect>
        <circle cx="160" cy="62" r="5" fill="#4ADE80"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
        <rect x="142" y="88" width="55" height="72" rx="12" fill="#18181D"/><rect x="205" y="88" width="55" height="72" rx="12" fill="#18181D"/>
        <rect x="150" y="128" width="26" height="18" rx="3" fill="#5B8CFF" fill-opacity="0.7"/><rect x="213" y="128" width="14" height="18" rx="3" fill="#5B8CFF" fill-opacity="0.7"/>
      </g>
      <rect width="270" height="170" rx="14" fill="none" stroke="#7AA2FF" stroke-width="3" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
      <text x="0" y="206" font-size="22" font-weight="800" fill="#F8FAFC">Bento</text>
      <text x="0" y="232" font-size="15" fill="#94A3B8">Everything in tiles</text>
    </g>

    <text x="640" y="306" font-size="16" fill="#94A3B8" text-anchor="middle">Settings › Layout · each device keeps its own choice · colours change under Look</text>
  </g>
</svg>
